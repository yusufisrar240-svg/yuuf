<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultraviolet</title><style>body{font-family:Arial,sans-serif;background:#111827;color:white;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center}.box{text-align:center;width:min(650px,90%)}h1{font-size:42px}input{box-sizing:border-box;width:100%;padding:18px;border:0;border-radius:14px;font-size:17px}#uv-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:white;z-index:10}</style><script src="baremux/index.js"></script><script src="uv/uv.bundle.js"></script><script src="uv/uv.config.js"></script></head><body><div class="box"><h1>Ultraviolet</h1><p>Enter a website or search below.</p><form id="uv-form"><input id="uv-search-engine" value="https://www.google.com/search?q=%s" type="hidden"><input id="uv-address" type="text" placeholder="Search the web or enter a URL"></form><p id="uv-error"></p><pre id="uv-error-code"></pre></div><iframe style="display:none" id="uv-frame"></iframe><script src="register-sw.js"></script><script src="search.js"></script><script src="index.js"></script></body></html>
